[workspace]
members = [".", "xtask"]
default-members = ["."]

[package]
name = "samplyd"
version = "0.1.0"
edition = "2024"
description = "Keep an elevated samply ready as a service; drive it from unprivileged processes."
license = "MIT-0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
] }

[profile.release]
lto = true
strip = true
